<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ロープの左端を動かし、波の伝わり方とリボンの振動を観察するシミュレーション。">
<title>ロープの波</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#29343a;background:#fafafa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1240px;margin:auto;padding:30px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}h1{font-size:20px;font-weight:600;margin:0}.mode{font-size:13px;color:#667680}.stage{position:relative;background:#fff;border:1px solid #d9dee1;border-radius:6px;overflow:hidden}.canvas-wrap{height:clamp(320px,60vh,620px)}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default}canvas.dragging{cursor:grabbing}canvas:focus-visible{outline:3px solid #428692;outline-offset:-3px}.hint{margin:0;border-top:1px solid #eef1f3;padding:12px 16px;font-size:13px;color:#647078}.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;margin-top:20px}.sliders{display:flex;gap:28px;flex:1 1 400px}label{display:block;flex:1;font-size:13px;min-width:0}.label-line{display:flex;justify-content:space-between;gap:16px}output{font-variant-numeric:tabular-nums;color:#426978}input[type=range]{display:block;accent-color:#247785;width:100%;height:26px;margin:12px 0 0;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:10px}button{min-height:46px;padding:11px 18px;border-radius:5px;font:inherit;font-size:14px;border:1px solid #cbd5db;background:#fff;color:#29343a;cursor:pointer;white-space:nowrap}button:hover{background:#edf3f5}button[aria-pressed=true]{background:#247785;border-color:#247785;color:#fff}button:focus-visible,input:focus-visible{outline:3px solid #428692;outline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}@media(max-width:600px){main{padding:20px 12px}header{margin-bottom:18px}h1{font-size:18px}.canvas-wrap{height:clamp(300px,53svh,480px)}.controls{gap:16px}.sliders{flex-basis:100%;gap:20px}.buttons{width:100%}.buttons button{flex:1 1 calc(50% - 5px);padding:11px 10px}.hint{font-size:12px;padding:12px}.label-line{gap:8px}}
</style>
</head>
<body>
<main>
<header><h1>ロープの波</h1><span id="mode" class="mode">手動</span></header>
<section class="stage" aria-label="ロープの波の観察画面">
<div class="canvas-wrap"><canvas id="rope" tabindex="0" role="application" aria-label="ロープの左端を上下にドラッグして波を作ります。キーボードでは上下矢印キーで操作できます。">Canvas対応のブラウザをご利用ください。</canvas></div>
<p class="hint">左端の丸をつまんで上下に動かす。「正弦波」で自動振動。</p>
</section>
<div class="controls">
<div class="sliders">
<label for="spacing"><span class="label-line"><span>印の間隔</span><output id="spacing-value" for="spacing">1.5 m</output></span><input id="spacing" type="range" min="0.1" max="3" step="0.1" value="1.5"></label>
<label for="speed"><span class="label-line"><span>波の速さ</span><output id="speed-value" for="speed">2.0 m/s</output></span><input id="speed" type="range" min="0.5" max="5" step="0.1" value="2"></label>
</div>
<div class="buttons"><button id="sine" type="button" aria-pressed="false">正弦波</button><button id="wave-toggle" type="button" aria-pressed="true">波形を表示</button><button id="pause" type="button">一時停止</button><button id="reset" type="button">リセット</button></div>
</div>
<span id="status" class="sr-only" role="status"></span>
</main>
<script>
'use strict';
const canvas=document.getElementById('rope'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const LENGTH=12,STEP=1/120,CAPACITY=8192,AMPLITUDE=1,FREQUENCY=.6;
// 境界の変位を、経過時間ではなく累積伝播距離に対して保存する。
// y(x,t)=g(s(t)-x), ds/dt=c。速度変更時も波形を飛ばさずに運ぶ。
const distances=new Float64Array(CAPACITY),heights=new Float64Array(CAPACITY);
let first=0,count=0,travel=0,simulationTime=0;
let sourceY=0,phase=0,automatic=false,running=true,showWave=true,pointer=null,activeKey=null;
let releaseStart=0,releaseY=0,returning=false,last=null,accumulator=0;
let width=0,height=0,ratio=1;
function announce(text){$('status').textContent=text;}
function record(distance,value){
  if(count>0){const newest=(first+count-1)%CAPACITY;if(Math.abs(distances[newest]-distance)<1e-12){heights[newest]=value;return;}}
  let slot=(first+count)%CAPACITY;
  if(count===CAPACITY){first=(first+1)%CAPACITY;slot=(first+count-1)%CAPACITY;}else count++;
  distances[slot]=distance;heights[slot]=value;
}
function boundaryAt(distance){
  if(count===0||distance<distances[first])return 0;
  const latest=(first+count-1)%CAPACITY;
  if(distance>=distances[latest])return heights[latest];
  let low=0,high=count-1;
  while(high-low>1){const mid=(low+high)>>1;if(distances[(first+mid)%CAPACITY]<=distance)low=mid;else high=mid;}
  const a=(first+low)%CAPACITY,b=(first+high)%CAPACITY;
  const fraction=(distance-distances[a])/(distances[b]-distances[a]);
  return heights[a]+(heights[b]-heights[a])*fraction;
}
function at(x){return x<=0?sourceY:boundaryAt(travel-x);}
function geometry(){
  const left=width<500?36:52,right=width-22,top=35,bottom=height-40;
  return {left,right,top,bottom,mid:(top+bottom)/2,scale:(bottom-top)*.32};
}
function updateUI(){
  $('sine').setAttribute('aria-pressed',String(automatic));
  $('wave-toggle').setAttribute('aria-pressed',String(showWave));
  $('pause').textContent=running?'一時停止':'再生';
  $('mode').textContent=automatic?'正弦波':'手動';
  $('spacing-value').textContent=`${Number($('spacing').value).toFixed(1)} m`;
  $('speed-value').textContent=`${Number($('speed').value).toFixed(1)} m/s`;
}
function returnToCenter(){returning=true;releaseStart=simulationTime;releaseY=sourceY;}
function detachPointer(){
  const captured=pointer;pointer=null;activeKey=null;canvas.classList.remove('dragging');
  if(captured!==null&&canvas.hasPointerCapture(captured))canvas.releasePointerCapture(captured);
}
function startManual(){
  automatic=false;returning=false;running=true;last=null;
  updateUI();
}
function setFromPointer(event){
  const rect=canvas.getBoundingClientRect(),g=geometry();
  sourceY=Math.max(-1.2,Math.min(1.2,(g.mid-(event.clientY-rect.top))/g.scale));
  record(travel,sourceY);draw();
}
canvas.addEventListener('pointerdown',event=>{
  if(pointer!==null||activeKey!==null||(event.pointerType==='mouse'&&event.button!==0))return;
  const rect=canvas.getBoundingClientRect(),g=geometry();
  const x=event.clientX-rect.left,y=event.clientY-rect.top;
  if(Math.hypot(x-g.left,y-(g.mid-sourceY*g.scale))>34)return;
  startManual();pointer=event.pointerId;canvas.setPointerCapture(pointer);canvas.classList.add('dragging');canvas.focus({preventScroll:true});setFromPointer(event);
});
canvas.addEventListener('pointermove',event=>{
  if(event.pointerId===pointer)setFromPointer(event);
  else if(pointer===null){const rect=canvas.getBoundingClientRect(),g=geometry();canvas.style.cursor=Math.hypot(event.clientX-rect.left-g.left,event.clientY-rect.top-(g.mid-sourceY*g.scale))<=34?'grab':'default';}
});
function release(event){if(event.pointerId!==pointer)return;pointer=null;canvas.classList.remove('dragging');returnToCenter();}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
canvas.addEventListener('keydown',event=>{
  if(!['ArrowUp','ArrowDown'].includes(event.key))return;
  event.preventDefault();if(pointer!==null)return;
  if(activeKey===null)startManual();activeKey=event.key;
  sourceY=Math.max(-1.2,Math.min(1.2,sourceY+(event.key==='ArrowUp'?.1:-.1)));
  record(travel,sourceY);draw();
});
canvas.addEventListener('keyup',event=>{if(event.key===activeKey){activeKey=null;returnToCenter();}});
canvas.addEventListener('blur',()=>{if(activeKey!==null){activeKey=null;returnToCenter();}});
$('sine').addEventListener('click',()=>{
  detachPointer();automatic=!automatic;
  if(automatic){phase=Math.asin(Math.max(-1,Math.min(1,sourceY/AMPLITUDE)));running=true;returning=false;last=null;announce('正弦波を発生しています');}
  else{returnToCenter();announce('手動操作に戻りました');}
  updateUI();
});
$('wave-toggle').addEventListener('click',()=>{showWave=!showWave;updateUI();draw();announce(showWave?'波形を表示しました':'波形を隠しました');});
$('pause').addEventListener('click',()=>{running=!running;last=null;updateUI();announce(running?'再生しました':'一時停止しました');});
$('reset').addEventListener('click',()=>{
  detachPointer();first=0;count=0;travel=0;simulationTime=0;sourceY=0;phase=0;
  automatic=false;running=true;returning=false;last=null;accumulator=0;
  record(0,0);updateUI();draw();announce('ロープをリセットしました');
});
for(const id of ['spacing','speed'])$(id).addEventListener('input',()=>{updateUI();draw();});
document.addEventListener('visibilitychange',()=>{
  last=null;
  if(document.hidden&&(pointer!==null||activeKey!==null)){detachPointer();returnToCenter();}
});
function step(dt){
  simulationTime+=dt;
  if(automatic){phase=(phase+2*Math.PI*FREQUENCY*dt)%(2*Math.PI);sourceY=AMPLITUDE*Math.sin(phase);}
  else if(returning){
    const u=Math.min(1,(simulationTime-releaseStart)/.25);
    sourceY=releaseY*(1-u*u*(3-2*u));if(u>=1){sourceY=0;returning=false;}
  }
  travel+=Number($('speed').value)*dt;record(travel,sourceY);
}
function marker(x,y,highlight,size=1){
  ctx.beginPath();ctx.arc(x,y,Math.max(1.2,5*size),0,2*Math.PI);
  ctx.fillStyle=highlight?'#cc7651':'#387b89';ctx.fill();
}
function draw(){
  if(width<=0||height<=0)return;
  ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,width,height);ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
  const g=geometry(),px=x=>g.left+x/LENGTH*(g.right-g.left),py=y=>g.mid-y*g.scale;
  ctx.lineWidth=1;ctx.font='11px system-ui';ctx.fillStyle='#7e8d96';
  for(let y=-1;y<=1;y+=.5){ctx.strokeStyle=y===0?'#cbd5db':'#eef1f3';ctx.beginPath();ctx.moveTo(g.left,py(y));ctx.lineTo(g.right,py(y));ctx.stroke();}
  const spacing=Number($('spacing').value),markerXs=[];
  const spacingPixels=spacing/LENGTH*(g.right-g.left);
  const guideEvery=Math.max(1,Math.ceil(14/spacingPixels));
  const markerSize=Math.min(1,Math.max(.18,spacingPixels/18));
  for(let x=spacing;x<=LENGTH+.001;x+=spacing){
    markerXs.push(x);if((markerXs.length-1)%guideEvery!==0)continue;ctx.setLineDash([3,5]);ctx.strokeStyle='#e5ebee';ctx.beginPath();ctx.moveTo(px(x),g.top);ctx.lineTo(px(x),g.bottom);ctx.stroke();
  }
  ctx.setLineDash([]);ctx.fillStyle='#71838e';ctx.textAlign='left';ctx.fillText('変位',12,20);ctx.textAlign='right';ctx.fillText('位置 (m) →',g.right,height-8);
  ctx.textAlign='center';for(let x=0;x<=LENGTH;x+=2)ctx.fillText(x,px(x),height-25);
  // 非反射の右向き進行波。右端に到達した波はそのまま画面外へ進む。
  if(showWave){
  ctx.strokeStyle='#526671';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.beginPath();
  const points=Math.ceil((g.right-g.left)*1.5);
  for(let i=0;i<=points;i++){const x=i/points*LENGTH;if(i===0)ctx.moveTo(px(x),py(at(x)));else ctx.lineTo(px(x),py(at(x)));}ctx.stroke();
  }
  for(let i=0;i<markerXs.length;i++)marker(px(markerXs[i]),py(at(markerXs[i])),i===Math.floor((markerXs.length-1)/2),markerSize);
  ctx.strokeStyle='#dce6ea';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(g.left,g.top);ctx.lineTo(g.left,g.bottom);ctx.stroke();
  const sourcePixel=py(sourceY);
  ctx.fillStyle='#e0eff1';ctx.beginPath();ctx.arc(g.left,sourcePixel,21,0,2*Math.PI);ctx.fill();
  ctx.fillStyle='#247785';ctx.beginPath();ctx.arc(g.left,sourcePixel,10,0,2*Math.PI);ctx.fill();
  ctx.font='14px system-ui';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('↕',g.left,sourcePixel+5);
}
new ResizeObserver(()=>{
  const rect=canvas.getBoundingClientRect();width=rect.width;height=rect.height;ratio=window.devicePixelRatio||1;
  canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);draw();
}).observe(canvas);
function frame(now){
  if(last!==null&&running&&!document.hidden){
    accumulator+=Math.min((now-last)/1000,.05);
    while(accumulator>=STEP){accumulator-=STEP;step(STEP);}
    draw();
  }
  last=now;requestAnimationFrame(frame);
}
record(0,0);updateUI();requestAnimationFrame(frame);
</script>
</body>
</html>
